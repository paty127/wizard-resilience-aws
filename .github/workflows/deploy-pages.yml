name: Deploy LP preview (GitHub Pages)

on:
  push:
    branches: [site-frontend]
    paths: ["lp/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: lp/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: lp
        run: pnpm install --frozen-lockfile

      - name: Build (base path para o Pages)
        working-directory: lp
        env:
          GITHUB_PAGES: "true"
        run: pnpm build

      - name: Montar artefato em /lp
        run: |
          mkdir -p pages-root/lp
          cp -r lp/dist/. pages-root/lp/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-root

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
